name: ${FOUNDATION_COMPOSE_PROJECT:-foundation-smoke-service}

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      network: none
    read_only: true
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/foundation-smoke-service", "--check"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    read_only: true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/foundation.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

volumes:
  prometheus-data:
  grafana-data:
