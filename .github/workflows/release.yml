name: Release / C++
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  cpp-release:
    uses: HoneyBury/cpp-project-foundation/.github/workflows/reusable-release.yml@v0.2.3
    with:
      conan-profile: conan/profiles/linux-gcc-x64
      conan-lockfile: conan/locks/linux-gcc-x64-release.lock
      cmake-target: foundation_smoke_service
