name: Security / C++
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpp-security:
    uses: HoneyBury/cpp-project-foundation/.github/workflows/reusable-security.yml@v0.2.2
    with:
      conan-profile: conan/profiles/linux-clang-x64
      conan-lockfile: conan/locks/linux-gcc-x64-release.lock
      test-target: foundation_smoke_service_tests
      fuzz-target: fuzz_request_parser
