name: Operations / Evidence
on:
  workflow_dispatch:
    inputs:
      soak-profile:
        type: choice
        options: [smoke, stability-2h, overnight-8h]
        default: smoke
permissions:
  contents: read
jobs:
  cpp-operations:
    uses: HoneyBury/cpp-project-foundation/.github/workflows/reusable-operations.yml@v0.2.3
    with:
      conan-profile: conan/profiles/linux-gcc-x64
      conan-lockfile: conan/locks/linux-gcc-x64-release.lock
      cmake-target: foundation_smoke_service
      soak-profile: ${{ inputs.soak-profile }}
